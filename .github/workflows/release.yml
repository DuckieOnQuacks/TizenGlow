name: Release

# Builds the TV service (TPK) and the TV app with the settings page (WGT), and publishes them.
#
# To release: set the same version in TizenGlow/tizen-manifest.xml, package.json,
# TizenGlowUI/js/wsClient.js (uiVersion) and TizenGlowUI/config.xml, commit, then push a tag
# "v<version>", e.g. v1.0.1. A GitHub Release is created with both packages and their SHA-256.
#
# Run it by hand (Actions > Release > Run workflow) to only build; the packages are then a
# downloadable artifact of the run.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the versions agree
        run: |
          manifest=$(grep -o 'package="io.gh.duckieonquacks.TizenGlow" version="[^"]*"' TizenGlow/tizen-manifest.xml | sed 's/.*version="//; s/"$//')
          package=$(jq -r .version package.json)
          page=$(grep -o "const uiVersion = '[^']*'" TizenGlowUI/js/wsClient.js | cut -d"'" -f2)
          min=$(grep -o "const minService = '[^']*'" TizenGlowUI/js/wsClient.js | cut -d"'" -f2)
          app=$(grep -o '<widget [^>]*version="[^"]*"' TizenGlowUI/config.xml | sed 's/.*version="//; s/"$//')
          echo "tizen-manifest.xml=$manifest package.json=$package wsClient.js=$page config.xml=$app"
          if [ -z "$manifest" ] || [ "$manifest" != "$package" ] || [ "$manifest" != "$page" ] || [ "$manifest" != "$app" ]; then
            echo "::error::versions differ: tizen-manifest.xml '$manifest', package.json '$package', wsClient.js uiVersion '$page', config.xml '$app'"
            exit 1
          fi
          if [ -z "$min" ] || [ "$(printf '%s\n' "$min" "$manifest" | sort -V | tail -n 1)" != "$manifest" ]; then
            echo "::error::wsClient.js minService '$min' must be set and no newer than $manifest"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $manifest"
            exit 1
          fi
          echo "VERSION=$manifest" >> "$GITHUB_ENV"
          echo "MIN_SERVICE=$min" >> "$GITHUB_ENV"

      - name: Check the page
        run: node tools/check-page.js

      - name: Build TPK
        run: dotnet build TizenGlow/TizenGlow.csproj -c Release

      # The app is the settings page as a Tizen web app. It is not signed here: a TV only accepts a
      # package signed with its owner's Samsung certificate anyway. js/service.js is TizenBrew's.
      - name: Build WGT
        run: |
          cd TizenGlowUI
          zip -r -X "../TizenGlow-$VERSION.wgt" config.xml index.html main.css icon.png js -x js/service.js

      - name: Checksum
        run: |
          tpk="io.gh.duckieonquacks.TizenGlow-$VERSION.tpk"
          wgt="TizenGlow-$VERSION.wgt"
          cp "TizenGlow/bin/Release/tizen90/$tpk" .
          sha256sum "$tpk" | tee "$tpk.sha256"
          sha256sum "$wgt" | tee "$wgt.sha256"
          echo "SHA256=$(cut -d' ' -f1 "$tpk.sha256")" >> "$GITHUB_ENV"
          echo "APP_SHA256=$(cut -d' ' -f1 "$wgt.sha256")" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TizenGlow-${{ env.VERSION }}
          path: |
            io.gh.duckieonquacks.TizenGlow-${{ env.VERSION }}.tpk*
            TizenGlow-${{ env.VERSION }}.wgt*

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          module=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          tpk="io.gh.duckieonquacks.TizenGlow-$VERSION.tpk"
          wgt="TizenGlow-$VERSION.wgt"
          if [ "$MIN_SERVICE" = "$VERSION" ]; then
            install="Install both. The page's top bar shows \`v$VERSION\` when the service and the page match, and says which one to update when they don't."
          else
            install="The page works with service $MIN_SERVICE or newer, so the TPK is only needed if yours is older. The top bar says when one of them needs updating."
          fi
          cat > notes.md <<EOF
          **TV service:** \`$tpk\`, SHA-256 \`$SHA256\`.

          **TV app (the settings page):** \`$wgt\`, SHA-256 \`$APP_SHA256\`. It opens the settings from its own icon and starts the service, without TizenBrew.

          Sign both for your TV before installing (TizenBrew Installer or Tizen Studio): the TPK carries only the Tizen SDK test certificates, and the app is unsigned.

          **Or through TizenBrew:** instead of the app, add the GitHub module \`$module\` to always get the latest page, or \`$module@$GITHUB_REF_NAME\` to stay on this one.

          $install
          EOF
          gh release create "$GITHUB_REF_NAME" "$tpk" "$tpk.sha256" "$wgt" "$wgt.sha256" --title "TizenGlow $VERSION" --notes-file notes.md
